# Fly.io deployment. SQLite on a persistent volume, one machine.
#
# One machine is not a limitation here, it is the design: SQLite serialises
# writes, and the application has a single user (ADR 004). Scaling out means
# moving to Postgres, not adding machines.

app = "acme-salary-management"
primary_region = "fra"

[build]

[env]
  RAILS_ENV = "production"
  DATABASE_PATH = "/data/production.sqlite3"
  SEED_ON_BOOT = "true"

[[mounts]]
  source = "salary_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Zero would mean the database is unreachable until a request wakes it, and
  # the first visitor pays the cold start.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[checks.health]
  type = "http"
  port = 3000
  path = "/up"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
